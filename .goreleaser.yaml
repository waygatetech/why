version: 2

builds:
  - main: .
    binary: why
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    # No -X flags: Go stamps the release tag into the build info, which `why --version` reads.
    ldflags:
      - -s -w

archives:
  - formats: [tar.gz]

checksum:
  name_template: checksums.txt
